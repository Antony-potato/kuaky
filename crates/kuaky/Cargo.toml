[package]
name = "kuaky"
description = "Editor ligero centrado en agentes de código."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kuaky-usage.workspace = true
kuaky-git.workspace = true
kuaky-term.workspace = true
kuaky-acp.workspace = true
kuaky-lsp.workspace = true
kuaky-mcp.workspace = true
lsp-types = "0.97"
similar = "3"
base64 = "0.22"
regex = "1"
# Mensajes de los webviews (lienzo, navegador) hacia GPUI.
flume = "0.11"
# Ventana padre de los webviews (ya viene con GPUI).
raw-window-handle = "0.6"
gpui-kit = { workspace = true, features = ["syntect"] }
# GPUI Kit pide syntect con fancy-regex; con `syntect-onig` también activo gana
# Oniguruma (en two-face y en syntect). Medido sobre 308 archivos TS/TSX/MD:
# fancy-regex 780 MB y 51 s, Oniguruma 53 MB y 12 s. Las cachés de cada regex
# de fancy-regex viven en el SyntaxSet global y nunca se liberan.
two-face = { version = "0.4.5", default-features = false, features = ["syntect-onig"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
dirs.workspace = true
ignore.workspace = true
# Miniaturas de las imágenes del chat (GPUI ya compila estos formatos).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Lienzo de diagramas (`canvas_view`): WebView2 en Windows, WKWebView en macOS. En Linux pide
# GTK/WebKitGTK, así que ahí no se incluye.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false }

[features]
# Modo de desarrollo: KUAKY_SCREENSHOT=archivo.png guarda una captura de la ventana y cierra.
screenshot = ["gpui-kit/test-support"]
