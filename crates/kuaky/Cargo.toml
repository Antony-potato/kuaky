[package]
name = "kuaky"
description = "Editor ligero centrado en agentes de código."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kuaky-usage.workspace = true
kuaky-git.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
jiff.workspace = true
dirs.workspace = true
ignore.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Modo de desarrollo: KUAKY_SCREENSHOT=archivo.png guarda una captura de la ventana y cierra.
screenshot = ["gpui-kit/test-support", "dep:image"]
