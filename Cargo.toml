[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/kuaky"]

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
kuaky-usage = { path = "crates/kuaky-usage" }
kuaky-git = { path = "crates/kuaky-git" }
kuaky-term = { path = "crates/kuaky-term" }
kuaky-acp = { path = "crates/kuaky-acp" }
kuaky-lsp = { path = "crates/kuaky-lsp" }
kuaky-mcp = { path = "crates/kuaky-mcp" }

# UI: versión exacta, GPUI es pre-1.0 y cambia su API entre versiones.
gpui-kit = "=0.11.0"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
rayon = "1"
walkdir = "2"
dirs = "6"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Poca información de depuración: el build completo de GPUI ocupa varios GB si no.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false
